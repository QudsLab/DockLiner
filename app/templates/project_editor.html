{% block content %}

<link id="cmTheme" rel="stylesheet" href="/static/vendor/codemirror/dracula.min.css">

<script src="/static/vendor/codemirror/yaml.min.js"></script>
<script src="/static/vendor/codemirror/shell.min.js"></script>

<style>
/* === VS Code-like Editor Page === */
.editor-page{display:flex;flex-direction:column;gap:0;height:calc(100vh - 100px);min-height:520px}
.editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--surface-soft);border-bottom:1px solid var(--hairline);min-height:40px}
.editor-toolbar .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.editor-toolbar .right{display:flex;align-items:center;gap:8px}
.editor-toolbar h1{font-size:13px;font-weight:400;color:var(--muted);margin:0}
.workspace{display:flex;gap:0;flex:1;background:var(--surface-card);min-height:0;overflow:hidden}

/* === Sidebar (VS Code Explorer) === */
.sidebar{width:260px;min-width:200px;background:#1e1e1e;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #2d2d2d}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;height:35px}
.sidebar-title{font-size:11px;font-weight:600;color:#bbbbbb;text-transform:uppercase;letter-spacing:.5px}
.sidebar-actions{display:flex;gap:2px}
.sidebar-actions button{background:transparent;border:none;color:#cccccc;cursor:pointer;padding:2px 4px;border-radius:3px;display:flex;align-items:center;justify-content:center;width:24px;height:24px}
.sidebar-actions button:hover{color:#ffffff;background:#2a2d2e}
.sidebar-search{padding:4px 8px 8px 8px}
.sidebar-search input{width:100%;background:#3c3c3c;border:1px solid #3c3c3c;color:#cccccc;padding:4px 8px;border-radius:3px;font-size:12px;outline:none}
.sidebar-search input:focus{border-color:#007acc}
.sidebar-search input::placeholder{color:#8b8b8b}
.tree{flex:1;overflow:auto;padding:0;font-size:13px;user-select:none}
.tree-item{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 0;cursor:pointer;color:#cccccc;white-space:nowrap;height:22px;line-height:22px}
.tree-item:hover{background:#2a2d2e}
.tree-item.active{background:#37373d;color:#ffffff}
.tree-item .label{overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:22px}
.tree-folder{font-weight:400}
.tree-chevron{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8b8b8b;flex-shrink:0}
.tree-indent{width:16px;flex-shrink:0}
.collapsed{display:none}

/* === Editor Pane === */
.editor-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#1e1e1e}

/* === Tabs (VS Code style) === */
.editor-tabs{display:flex;background:#252526;min-height:35px;overflow-x:auto;align-items:end;border-bottom:1px solid #2d2d2d}
.editor-tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;color:#8b8b8b;cursor:pointer;background:#2d2d2d;white-space:nowrap;min-width:100px;max-width:200px;border-right:1px solid #252526;height:35px}
.editor-tab.active{color:#ffffff;background:#1e1e1e;border-top:1px solid #007acc}
.editor-tab .name{overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}
.editor-tab .close{font-size:14px;line-height:1;color:#8b8b8b;margin-left:4px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.editor-tab .close:hover{color:#ffffff;background:#5a5a5a}
.editor-tab.active .close:hover{background:#37373d}

/* === Editor Box === */
.editor-box{flex:1;position:relative;min-height:0;overflow:hidden;background:#1e1e1e}
.empty-editor{display:flex;align-items:center;justify-content:center;height:100%;color:#8b8b8b;font-size:13px;user-select:none}

/* === Status Bar (VS Code style) === */
.editor-status{display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#007acc;color:#ffffff;font-size:12px;font-family:var(--font-mono);height:22px;line-height:22px;user-select:none}
.editor-status .left{display:flex;gap:16px}
.editor-status .right{display:flex;gap:16px}

/* === CodeMirror Overrides === */
.CodeMirror{font-family:"Cascadia Code","Fira Code","JetBrains Mono",var(--font-mono),monospace!important;font-size:13px!important;height:100%!important;background:#1e1e1e!important;color:#d4d4d4!important}
.CodeMirror-gutters{background:#1e1e1e!important;border-right:1px solid #2d2d2d!important;padding-right:8px!important}
.CodeMirror-linenumber{color:#858585!important;font-size:12px!important}
.CodeMirror-cursor{border-left-color:#aeafad!important;border-left-width:2px!important}
.CodeMirror-selected{background:#264f78!important}
.CodeMirror-activeline-background{background:#2a2d2e!important}
.CodeMirror-lines{padding:4px 0!important}



/* === File Icons === */
.file-icon{width:16px;height:16px;fill:currentColor;flex-shrink:0}
.file-icon.python{color:#3572A5}
.file-icon.docker{color:#2496ed}
.file-icon.js{color:#f0db4f}
.file-icon.json{color:#f0db4f}
.file-icon.css{color:#264de4}
.file-icon.html{color:#e34c26}
.file-icon.env{color:#f59e0b}
.file-icon.gitignore{color:#f43f5e}
.file-icon.requirements{color:#10b981}
.file-icon.compose{color:#6a6a6a}
.file-icon.markdown{color:#6a6a6a}
.file-icon.txt{color:#6a6a6a}
.file-icon.folder{color:#dcb67a}
.file-icon.file{color:#6a6a6a}

/* === Modal === */
.modal-overlay{z-index:90}

/* === Buttons in toolbar === */
.editor-toolbar .btn{font-size:12px;padding:4px 10px;height:26px;line-height:18px;border-radius:3px}
.editor-toolbar .btn-primary{background:#007acc;color:#fff;border:1px solid #007acc}
.editor-toolbar .btn-primary:hover{background:#1a8ad4}
.editor-toolbar .btn-secondary{background:transparent;color:#cccccc;border:1px solid transparent}
.editor-toolbar .btn-secondary:hover{background:#2a2d2e;color:#ffffff}


/* === Responsive === */
@media (max-width:768px){
  .editor-page{height:auto}
  .workspace{flex-direction:column}
  .sidebar{width:100%;max-height:220px;border-right:none;border-bottom:1px solid #2d2d2d}
}
</style>

<div class="editor-toolbar">

</div>



<div id="nameModal" class="modal-overlay" style="display:none;">

  </div>
</div>

function fileIconSVG(path,isFolder){
  const base=path.split('/').pop().toLowerCase();
  let name='file';
  if(isFolder) name='folder';
  else if(base==='dockerfile') name='docker';
  else if(base.endsWith('.yml')||base.endsWith('.yaml')) name='compose';
  else if(base==='.env'||base==='.env.example'||base==='env.example') name='env';
  else if(base==='.gitignore'||base.endsWith('.ignore')) name='gitignore';
  else if(base==='requirements.txt') name='requirements';
  else if(base.endsWith('.py')) name='python';
  else if(base.endsWith('.js')||base.endsWith('.ts')||base.endsWith('.jsx')||base.endsWith('.tsx')) name='js';
  else if(base.endsWith('.html')||base.endsWith('.htm')) name='html';
  else if(base.endsWith('.css')) name='css';
  else if(base.endsWith('.md')||base.endsWith('.markdown')) name='markdown';
  else if(base.endsWith('.json')) name='json';
  else if(base.endsWith('.txt')) name='txt';
  return FILE_SVGS[name]||FILE_SVGS.file;
}

function guessLang(path){
  const p=path.toLowerCase();
  if(p.endsWith('dockerfile')) return 'dockerfile';
  if(p.endsWith('.env')||p.endsWith('.ini')) return 'shell';
  if(p.endsWith('.yml')||p.endsWith('.yaml')) return 'yaml';
  if(p.endsWith('.sh')||p.endsWith('.bash')) return 'shell';
  if(p.endsWith('.py')) return 'python';
  if(p.endsWith('.js')||p.endsWith('.jsx')) return 'javascript';
  if(p.endsWith('.ts')||p.endsWith('.tsx')) return 'text/typescript';
  if(p.endsWith('.json')) return 'application/json';
  if(p.endsWith('.html')||p.endsWith('.xml')) return 'text/html';
  if(p.endsWith('.css')) return 'css';
  if(p.endsWith('.md')) return 'text/x-markdown';
  if(p.endsWith('.sql')) return 'text/x-sql';
  if(p.endsWith('.php')) return 'php';
  if(p.endsWith('.toml')) return 'toml';
  if(p.endsWith('.c')||p.endsWith('.h')) return 'text/x-csrc';
  if(p.endsWith('.cpp')||p.endsWith('.hpp')) return 'text/x-c++src';
  if(p.endsWith('.go')) return 'text/x-go';
  if(p.endsWith('.rs')) return 'text/x-rustsrc';
  if(p.endsWith('.ps1')) return 'powershell';
  if(p.endsWith('.bat')||p.endsWith('.cmd')) return 'batch';
  return 'text';
}

function buildTree(entries){
  var root={name:'',children:{},files:[]};
  entries.forEach(function(entry){
    var parts=entry.path.split('/');
    var cur=root;
    for(var i=0;i<parts.length-(entry.is_dir?0:1);i++){
      var nm=parts[i];
      if(!cur.children[nm]) cur.children[nm]={name:nm,children:{},files:[]};
      cur=cur.children[nm];
    }
    if(!entry.is_dir) cur.files.push(entry);
  });
  return root;
}
function shouldShow(path){return !treeFilter||path.toLowerCase().indexOf(treeFilter)>=0;}

function renderNode(node,depth,pathPrefix){
  var dirPath=pathPrefix?pathPrefix+'/'+node.name:node.name;
  var expanded=folderExpanded[dirPath]||treeFilter.length>0;
  var div=document.createElement('div');
  // folder row
  var row=document.createElement('div');
  row.className='tree-item tree-folder';
  row.setAttribute('data-path',dirPath);
  row.setAttribute('data-isdir','true');
  row.style.paddingLeft=(8+depth*14)+'px';
  row.innerHTML='<span class="tree-chevron">'+(expanded?'▾':'▸')+'</span>'+fileIconSVG(dirPath,true)+'<span class="label">'+escapeHtml(node.name)+'</span>';
  div.appendChild(row);
  // children container
  var childDiv=document.createElement('div');
  if(!expanded) childDiv.className='collapsed';
  // subdirs
  var dirNames=Object.keys(node.children).sort();
  for(var di=0;di<dirNames.length;di++){
    var sub=renderNode(node.children[dirNames[di]],depth+1,dirPath);
    if(sub) childDiv.appendChild(sub);
  }
  // files
  node.files.sort(function(a,b){return a.path.localeCompare(b.path);});
  for(var fi=0;fi<node.files.length;fi++){
    var f=node.files[fi];
    if(treeFilter && !shouldShow(f.path)) continue;
    var frow=document.createElement('div');
    frow.className='tree-item file'+(f.path===activeFile?' active':'');
    frow.setAttribute('data-path',f.path);
    frow.setAttribute('data-isdir','false');
    frow.style.paddingLeft=(8+(depth+1)*14)+'px';
    frow.innerHTML='<span class="tree-indent"></span>'+fileIconSVG(f.path)+'<span class="label">'+escapeHtml(f.path.split('/').pop())+'</span>';
    childDiv.appendChild(frow);
  }
  div.appendChild(childDiv);
  return div;
}

function renderTree(){
  var tree=document.getElementById('fileTree'); if(!tree) return;
  tree.innerHTML='';
  var root=buildTree(flatFiles);
  // root files
  root.files.sort(function(a,b){return a.path.localeCompare(b.path);});
  for(var i=0;i<root.files.length;i++){
    var f=root.files[i];
    if(treeFilter && !shouldShow(f.path)) continue;
    var row=document.createElement('div');
    row.className='tree-item file'+(f.path===activeFile?' active':'');
    row.setAttribute('data-path',f.path);
    row.setAttribute('data-isdir','false');
    row.style.paddingLeft='8px';
    row.innerHTML=fileIconSVG(f.path)+'<span class="label">'+escapeHtml(f.path)+'</span>';
    tree.appendChild(row);
  }
  // root dirs
  var dirNames=Object.keys(root.children).sort();
  for(var di=0;di<dirNames.length;di++){
    var rendered=renderNode(root.children[dirNames[di]],0,'');
    if(rendered) tree.appendChild(rendered);
  }
}

// Event delegation for tree clicks
document.addEventListener('click',function(e){
  var el=e.target;
  while(el && el.parentNode){
    if(el.classList && el.classList.contains('tree-item')){
      var path=el.getAttribute('data-path');
      var isdir=el.getAttribute('data-isdir');
      if(isdir==='true'){
        folderExpanded[path]=!folderExpanded[path];
        renderTree();
      }else if(path){
        openFile(path);
      }
      return;
    }
    el=el.parentNode;
  }
});

async function loadFiles(){
  try{
    var r=await fetch('/api/projects/'+pid+'/files');
    if(!r.ok) throw new Error(r.status+' '+r.statusText);
    var data=await r.json();
    flatFiles=(data.files||[]).sort(function(a,b){return a.path.localeCompare(b.path);});
    folderExpanded={};
    renderTree();
  }catch(err){
    var tree=document.getElementById('fileTree');
    if(tree) tree.innerHTML='<div style="padding:10px;color:var(--error)">Failed to load files: '+escapeHtml(err.message)+'</div>';
    console.error(err);
  }
}
function filterTree(){treeFilter=document.getElementById('fileSearch').value.trim().toLowerCase();if(treeFilter) Object.keys(folderExpanded).forEach(function(k){folderExpanded[k]=true;});renderTree();}

function makeEditor(mountId,lang,value){
  var el=document.getElementById(mountId);
  el.innerHTML='';
  var cm=CodeMirror(el,{
    value: value||'',
    mode: lang,
    theme: document.documentElement.getAttribute('data-theme')==='dark'?'dracula':'default',
    lineNumbers:true,
    tabSize:2,
    indentWithTabs:false,
    lineWrapping:false,
    extraKeys:{"Ctrl-S":function(){saveCurrentFile();},"Tab":function(){cm.replaceSelection("  ","end");}}
  });
  return cm;
}

function updateStatus(){
  document.getElementById('statusPath').textContent=activeFile||'No file open';
  document.getElementById('statusLang').textContent=activeFile?guessLang(activeFile).toUpperCase():'';
  var lines=editorInst?editorInst.lineCount():0;
  document.getElementById('statusLines').textContent=lines+' lines';
}

async function openFile(path){
  if(!openFiles.find(function(f){return f.path===path;})) openFiles.push({path:path,dirty:false});
  activeFile=path; renderTabs();
  var r=await fetch('/api/projects/'+pid+'/files/'+encodeURIComponent(path));
  var d=await r.json();
  var box=document.getElementById('editorBox');
  box.innerHTML='<div id="editor-mount" style="height:100%;"></div>';
  editorInst=makeEditor('editor-mount',guessLang(path),d.content||'');
  editorInst.on('change',function(){var f=openFiles.find(function(x){return x.path===activeFile;});if(f){f.dirty=true;renderTabs();}});
  editorInst.on('update',updateStatus);
  var f=openFiles.find(function(x){return x.path===path;}); if(f){f.dirty=false;renderTabs();}
  setTheme();
  updateStatus();
  editorInst.focus();
}

function renderTabs(){
  var box=document.getElementById('fileTabs'); if(!box) return;
  box.innerHTML=openFiles.map(function(f){
    var name=f.path.split('/').pop();
    var active=f.path===activeFile;
    return '<div class="editor-tab '+(active?'active':'')+'" onclick="switchTab(\''+f.path.replace(/'/g,"\\'")+'\')">'+fileIconSVG(f.path)+'<span class="name">'+escapeHtml(name)+(f.dirty?' •':'')+'</span><span class="close" onclick="closeTab(event,\''+f.path.replace(/'/g,"\\'")+'\')">×</span></div>';
  }).join('');
}
function switchTab(path){activeFile=path;renderTabs();openFile(path);}
function closeTab(e,path){e.stopPropagation();openFiles=openFiles.filter(function(f){return f.path!==path;});if(activeFile===path){activeFile=openFiles.length?openFiles[0].path:null;if(activeFile) openFile(activeFile);else{document.getElementById('editorBox').innerHTML='<div class="empty-editor">Select a file to start editing</div>';editorInst=null;updateStatus();}}renderTabs();}

async function saveCurrentFile(){
  if(!activeFile||!editorInst) return;
  var content=editorInst.getValue();
  var r=await fetch('/api/projects/'+pid+'/files/'+encodeURIComponent(activeFile),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content})});
  var f=openFiles.find(function(x){return x.path===activeFile;}); if(f) f.dirty=false;
  renderTabs();
  showToast(r.ok?activeFile.split('/').pop()+' saved':'Save failed',r.ok?'success':'error');
}

function setTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('cmTheme').href='/static/vendor/codemirror/'+(isDark?'dracula.min.css':'codemirror.min.css');
  if(editorInst) editorInst.setOption('theme',isDark?'dracula':'default');
}

// Modal helpers for new file/folder
function showCreateModal(type,basePath){createModalType=type;createModalFolder=basePath||'';document.getElementById('nameModalTitle').textContent=type==='file'?'New file':'New folder';document.getElementById('nameModalInput').value='';document.getElementById('nameModal').style.display='flex';document.getElementById('nameModalInput').focus();}
function closeNameModal(){document.getElementById('nameModal').style.display='none';}
async function nameModalOk(){
  var name=document.getElementById('nameModalInput').value.trim(); if(!name){closeNameModal();return;}
  var rel=createModalFolder?createModalFolder+'/'+name:name;
  var url=createModalType==='folder'?'/api/projects/'+pid+'/mkdir/'+encodeURIComponent(rel):'/api/projects/'+pid+'/files/'+encodeURIComponent(rel);
  var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:''})});
  var d=await r.json().catch(function(){return {};});
  closeNameModal(); await loadFiles();
  showToast(r.ok?'Created':'Create failed: '+(d.detail||r.statusText),r.ok?'success':'error');
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg,type){
  type=type||'info';
  var div=document.createElement('div');
  div.style.cssText='position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:8px;background:'+(type==='error'?'var(--error)':type==='success'?'var(--success)':'var(--primary)')+';color:#fff;z-index:9999;font-size:13px;';
  div.textContent=msg; document.body.appendChild(div); setTimeout(function(){div.remove();},2500);
}

window.addEventListener('themeChanged',setTheme);
document.addEventListener('DOMContentLoaded',loadFiles);
loadFiles();
</script>

{% endblock %}
