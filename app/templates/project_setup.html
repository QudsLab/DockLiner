{% extends "base.html" %}
{% block title %}Project Setup — DockLiner{% endblock %}
{% block content %}

<link id="prismTheme" rel="stylesheet" href="/static/vendor/prism/prism.min.css">
<script src="/static/vendor/prism/prism.min.js"></script>
<script src="/static/vendor/prism/prism-yaml.min.js"></script>
<script src="/static/vendor/prism/prism-docker.min.js"></script>
<script src="/static/vendor/prism/prism-bash.min.js"></script>
<script src="/static/vendor/prism/prism-ini.min.js"></script>

<style>
.editor-outer{display:flex;border:1px solid var(--hairline);border-radius:0 0 var(--radius-md) var(--radius-md);overflow:hidden;background:var(--surface-card);min-height:360px}
.editor-gutter{padding:12px 10px 12px 8px;background:var(--surface-soft);border-right:1px solid var(--hairline);font-family:var(--font-mono)!important;font-size:13px!important;line-height:1.65!important;color:var(--muted);text-align:right;user-select:none;white-space:pre;overflow:hidden;min-width:44px;flex-shrink:0}
.prism-editor-wrap{display:grid;flex:1;overflow:auto;min-height:360px}
.prism-editor-wrap>pre[class*="language-"],.prism-editor-wrap>textarea{grid-area:1/1;padding:12px!important;margin:0!important;font-family:var(--font-mono)!important;font-size:13px!important;line-height:1.65!important;tab-size:2;-moz-tab-size:2;white-space:pre!important;box-sizing:border-box;border:none!important;border-radius:0!important;min-width:100%}
.prism-editor-wrap>pre[class*="language-"]{z-index:0;pointer-events:none;overflow:auto!important;background:transparent!important;text-shadow:none!important;height:100%}
.prism-editor-wrap>pre[class*="language-"]>code[class*="language-"]{padding:0!important;margin:0!important;background:transparent!important;text-shadow:none!important;display:block;font-family:inherit!important;font-size:inherit!important;line-height:inherit!important;min-height:100%}
.prism-editor-wrap .token{text-shadow:none!important;background:transparent!important}
.prism-editor-wrap>textarea{background:transparent;color:transparent;caret-color:var(--ink);-webkit-text-fill-color:transparent;outline:none;resize:none;z-index:1;overflow:hidden;height:100%;-webkit-appearance:none;appearance:none}
html[data-theme="dark"] .editor-outer{background:#1e1e1e;border-color:var(--hairline)}
html[data-theme="dark"] .editor-gutter{background:#252526;border-color:var(--hairline);color:#6e7681}
html[data-theme="dark"] .prism-editor-wrap{background:#1e1e1e}
html[data-theme="dark"] .prism-editor-wrap>textarea{caret-color:#abb2bf}
.setup-card{border:1px solid var(--hairline);border-radius:var(--radius-md);padding:16px;background:var(--surface-card);margin-bottom:16px}
.setup-card p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.setup-card p b{color:var(--ink)}
.file-tabs{display:flex;gap:6px;border-bottom:2px solid var(--hairline);margin-bottom:0;padding:4px;background:var(--surface-card);border-radius:var(--radius-md) var(--radius-md) 0 0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.file-tab{padding:10px 18px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:8px;background:transparent;border:none;border-radius:8px 8px 0 0}
.file-tab.active{color:#ff7300;border-bottom-color:#ff7300;background:rgba(255,115,0,.10)}
.file-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.file-tab.active .dot{background:#ff7300}
.editor-card{border:1px solid var(--hairline);border-top:none;border-radius:0 0 var(--radius-md) var(--radius-md);overflow:hidden;background:var(--surface-card);display:none}
.editor-card.active{display:block}
.editor-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--hairline);background:var(--surface-soft)}
.editor-header span{font-weight:700;font-size:14px;color:var(--ink)}
.file-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--hairline);font-size:12px;background:var(--surface-soft);color:var(--ink)}
.file-chip.missing{border-color:var(--hairline);color:var(--muted)}
.file-chip.ok{border-color:var(--success);background:rgba(34,197,94,.10);color:var(--success)}
.file-chip.warn{border-color:var(--error);background:rgba(239,68,68,.10);color:var(--error)}
</style>

<h1 class="hero-title">Project Setup</h1>
<p class="section-subtitle">Configure how DockLiner builds and runs your project.</p>

<div class="setup-card">
  <p>Source: <b id="sourceDisplay">-</b></p>
  <label style="font-size:12px;color:var(--muted);">Project name *</label>
  <input class="input" id="projectName" placeholder="my-app" style="margin-top:6px;max-width:420px;">
</div>

<div class="file-tabs" role="tablist">
  <button class="file-tab active" onclick="switchTab('compose')" role="tab" aria-selected="true"><span class="dot"></span><span id="composeTabLabel">compose</span></button>
  <button class="file-tab" onclick="switchTab('dockerfile')" role="tab"><span class="dot"></span>Dockerfile</button>
  <button class="file-tab" onclick="switchTab('env')" role="tab"><span class="dot"></span>.env</button>
</div>

<div class="editor-card active" id="card-compose">
  <div class="editor-header"><span id="composeHeader">compose.yml</span><span class="file-chip" id="composeStatus">will create</span></div>
  <div style="padding:10px 12px 0;display:none;" id="composePickerWrap">
    <label style="font-size:12px;color:var(--muted);">No compose file found. Select one from the repo or leave default to create new:</label>
    <select id="composePicker" class="input" style="margin-top:6px;" onchange="pickFile('compose', this.value)"></select>
  </div>
  <div id="editor-compose"></div>
</div>

<div class="editor-card" id="card-dockerfile">
  <div class="editor-header"><span>Dockerfile</span><span class="file-chip" id="dockerfileStatus">will create</span></div>
  <div style="padding:10px 12px 0;display:none;" id="dockerfilePickerWrap">
    <label style="font-size:12px;color:var(--muted);">No Dockerfile found. Select one from the repo or leave default to create new:</label>
    <select id="dockerfilePicker" class="input" style="margin-top:6px;" onchange="pickFile('dockerfile', this.value)"></select>
  </div>
  <div id="editor-dockerfile"></div>
</div>

<div class="editor-card" id="card-env">
  <div class="editor-header"><span>.env</span><span class="file-chip" id="envStatus">will create</span></div>
  <div style="padding:10px 12px 0;display:none;" id="envPickerWrap">
    <label style="font-size:12px;color:var(--muted);">No .env found. Select one from the repo or leave default to create new:</label>
    <select id="envPicker" class="input" style="margin-top:6px;" onchange="pickFile('env', this.value)"></select>
  </div>
  <div id="editor-env"></div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;">
  <button class="btn btn-primary" onclick="submitProject()">Create Project</button>
  <button class="btn btn-secondary" onclick="history.back()">← Back</button>
  <span id="saveMsg" style="font-size:13px;color:var(--muted);"></span>
</div>

<script>
let setup={source:'{{ source }}', path:'{{ path | e }}', source_path:'{{ source_path | e }}', downloadId:'{{ download_id }}', scan:{{ scan_json | safe if scan_json else '{}' }}};
const editors={};
let selectedComposeFile='docker-compose.yml';

function switchTab(name){
  document.querySelectorAll('.file-tab').forEach(t=>{
    const isActive = t.getAttribute('onclick').includes("'"+name+"'");
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive);
  });
  document.querySelectorAll('.editor-card').forEach(c=>c.classList.toggle('active', c.id==='card-'+name));
  setTimeout(()=>{ if(editors[name]) editors[name].refresh(); }, 10);
}
function setStatus(id, exists){
  const el=document.getElementById(id);
  el.className='file-chip '+(exists?'ok':'missing');
  el.textContent=exists?'found in source':'will create';
}
function populatePicker(id, files, kind, selectedPath){
  const wrap=document.getElementById(id+'PickerWrap');
  const sel=document.getElementById(id+'Picker');
  const label=document.getElementById(id+'PickerWrap').querySelector('label');
  if(!wrap || !sel) return;
  const candidates = files.filter(f => {
    const lower=f.toLowerCase();
    if(kind==='compose') return lower.endsWith('compose.yml')||lower.endsWith('compose.yaml')||lower.endsWith('docker-compose.yml')||lower.endsWith('docker-compose.yaml');
    if(kind==='dockerfile') return lower==='dockerfile' || lower.endsWith('/dockerfile');
    if(kind==='env') return lower==='.env' || lower==='env' || lower.endsWith('/.env') || lower.endsWith('/env');
    return false;
  });
  if(candidates.length===0){
    sel.innerHTML = `<option value="">-- create new --</option>`;
    label.textContent = `No ${kind==='compose'?'compose file':kind} found. Select one from the repo or leave default to create new:`;
    label.style.display='block';
    wrap.style.display='block';
    return;
  }
  const first = selectedPath || candidates[0];
  sel.innerHTML = candidates.map(f=>`<option value="${f.replace(/"/g,'&quot;')}" ${f===first?'selected':''}>${f}</option>`).join('');
  label.style.display='none';
  wrap.style.display='block';
  pickFile(kind, first);
}
function pickFile(kind, path){
  if(!path) return;
  const d=setup.scan||{};
  const content = (d.file_map || {})[path] || '';
  if(kind==='compose'){ selectedComposeFile=path; document.getElementById('composeHeader').textContent=path; if(content) editors.compose.setValue(content); }
  if(kind==='dockerfile'){ if(content) editors.dockerfile.setValue(content); }
  if(kind==='env'){ if(content) editors.env.setValue(content); }
  setStatus(kind+'Status', true);
}
function makeEditor(mountId, lang, value){
  const el = document.getElementById(mountId);
  el.innerHTML = `<div class="editor-outer"><div class="editor-gutter" aria-hidden="true"></div><div class="prism-editor-wrap"><pre class="language-${lang}"><code class="language-${lang}"></code></pre><textarea spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea></div></div>`;
  const gutter = el.querySelector('.editor-gutter');
  const wrap = el.querySelector('.prism-editor-wrap');
  const code = wrap.querySelector('code');
  const ta = wrap.querySelector('textarea');
  function update(){
    code.textContent = ta.value;
    if(window.Prism) Prism.highlightElement(code);
    const lines = (ta.value.match(/\n/g)||[]).length + 1;
    gutter.textContent = Array.from({length:lines},(_,i)=>i+1).join('\n');
    gutter.scrollTop = wrap.scrollTop;
  }
  wrap.addEventListener('scroll', ()=>{ gutter.scrollTop = wrap.scrollTop; });
  ta.value = value || '';
  ta.addEventListener('input', update);
  ta.addEventListener('keydown', e=>{
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(en); ta.selectionStart=ta.selectionEnd=s+2; update(); }
  });
  update();
  return { getValue:()=>ta.value, setValue:(v)=>{ta.value=v;update();}, refresh:()=>{}, setOption:()=>{}, getOption:()=>'', getWrapperElement:()=>el.querySelector('.editor-outer'), toTextArea:()=>{el.innerHTML='';} };
}
function setTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('prismTheme').href = '/static/vendor/prism/' + (isDark?'prism-dark.min.css':'prism.min.css');
}
(function(){
  const s=setup.source;
  let text='Unknown';
  if(s==='github') text='GitHub clone';
  if(s==='local') text='Local directory: '+setup.path;
  if(s==='download') text='Existing download #'+setup.downloadId;
  const d=setup.scan||{};
  document.getElementById('sourceDisplay').textContent=text;
  document.getElementById('projectName').value = d.repo_name || (s==='local'?setup.path.split(/[\\/]/).pop():'');

  selectedComposeFile = d.compose_file || 'docker-compose.yml';
  const composeName = selectedComposeFile;
  document.getElementById('composeTabLabel').textContent = composeName;
  document.getElementById('composeHeader').textContent = composeName;

  editors.compose = makeEditor('editor-compose', 'yaml', d.compose || defaultCompose());
  editors.dockerfile = makeEditor('editor-dockerfile', 'docker', d.dockerfile || defaultDockerfile());
  editors.env = makeEditor('editor-env', 'bash', d.env || d.example_env || '');

  setStatus('composeStatus', !!(d.compose_file && d.compose));
  setStatus('dockerfileStatus', !!d.dockerfile_exists);
  setStatus('envStatus', !!(d.env || d.example_env));
  populatePicker('compose', d.files || [], 'compose', d.compose_file);
  populatePicker('dockerfile', d.files || [], 'dockerfile', 'Dockerfile');
  populatePicker('env', d.files || [], 'env', d.env_path || d.example_env_path);
  setTheme();
})();

function defaultCompose(){ return `version: '3.8'

services:
  app:
    build: .
    container_name: app
    ports:
      - "25600:3000"
    env_file:
      - .env
    restart: unless-stopped
`; }
function defaultDockerfile(){ return `FROM node:20-alpine
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
EXPOSE 3000
CMD ["node", "server.js"]
`; }

async function submitProject(){
  const name=document.getElementById('projectName').value.trim();
  if(!name){ showModal('Project name is required'); return; }
  const payload={
    name,
    compose_file: selectedComposeFile,
    compose_content:editors.compose.getValue(),
    dockerfile_content:editors.dockerfile.getValue(),
    env_content:editors.env.getValue(),
    command_mode:'compose',
    deploy_method:'compose',
    source_type:setup.source,
    source_path:setup.source_path||setup.path||'',
    github_repo_url:setup.scan?.clone_url||''
  };
  try{
    const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ location.href='/projects'; }
    else{ showModal(d.detail||'Failed to create project'); }
  }catch(e){ showModal('Error: '+e.message); }
}

function showModal(msg){
  showErrorModal('Error', msg);
}

window.addEventListener('themeChanged', setTheme);
</script>

{% endblock %}
