{% extends "base.html" %}
{% block title %}Config Editor — DockLiner{% endblock %}
{% block content %}
<style>
.config-page{max-width:100%;margin:0 auto;padding:16px 50px 12px;height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden}

/* Override base .layout on the settings config page: remove max-width and padding so the config page fills the viewport */
.layout:has(> .config-page){max-width:none;padding:0}
@media (max-width:768px){.layout:has(> .config-page){padding:0}}

.config-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex:0 0 auto}
.config-header h1{margin:0;font-size:22px}
.config-card{background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.config-path{color:var(--muted);font-size:12px;margin-bottom:10px;flex:0 0 auto}

/* Editor wrapper fills remaining card space */
.editor-wrap{position:relative;width:100%;flex:1 1 auto;min-height:0;border:1px solid rgba(255,115,0,.45);border-radius:10px;overflow:hidden;background:#0b1220;box-shadow:inset 0 4px 18px rgba(0,0,0,.45)}

/* Line numbers */
.line-gutter{position:absolute;left:0;top:0;bottom:0;width:48px;background:#070b14;border-right:1px solid #1e293b;color:#475569;font-family:var(--font-mono),"JetBrains Mono","Fira Code","Consolas","Liberation Mono","Courier New",monospace;font-size:13px;line-height:1.65;text-align:right;padding:12px 10px 12px 0;overflow:hidden;user-select:none}

/* Code layers */
.code-layer{position:absolute;left:48px;top:0;right:0;bottom:0;margin:0;padding:12px 16px;font-family:var(--font-mono),"JetBrains Mono","Fira Code","Consolas","Liberation Mono","Courier New",monospace;font-size:14px;line-height:1.65;white-space:pre;overflow:auto;tab-size:4;box-sizing:border-box;letter-spacing:normal;word-spacing:normal;font-variant-ligatures:none;text-rendering:geometricPrecision}
#codeHighlight{color:#e2e8f0;background:transparent;pointer-events:none;z-index:2}
#codeHighlight code{font-family:inherit;font-size:inherit;line-height:inherit;letter-spacing:inherit;word-spacing:inherit;font-variant-ligatures:inherit}
#configEditor{
    color:transparent;
    background:transparent;
    caret-color:#fff;
    z-index:3;
    resize:none;
    border:none;
    outline:none;
    /* Force identical text metrics so the caret lines up exactly with the highlight layer */
    font-family:var(--font-mono),"JetBrains Mono","Fira Code","Consolas","Liberation Mono","Courier New",monospace;
    font-size:14px;
    line-height:1.65;
    white-space:pre;
    overflow-wrap:normal;
    word-break:normal;
    tab-size:4;
    letter-spacing:normal;
    word-spacing:normal;
    font-variant-ligatures:none;
    text-rendering:geometricPrecision;
}
#configEditor::selection{background:rgba(255,115,0,.25);color:transparent}

/* Custom scrollbars for WebKit browsers */
.code-layer::-webkit-scrollbar,
.line-gutter::-webkit-scrollbar{width:10px;height:10px;background:#070b14}
.code-layer::-webkit-scrollbar-thumb,
.line-gutter::-webkit-scrollbar-thumb{background:#334155;border-radius:6px;border:2px solid #070b14}
.code-layer::-webkit-scrollbar-thumb:hover,
.line-gutter::-webkit-scrollbar-thumb:hover{background:#475569}
.code-layer::-webkit-scrollbar-corner{background:#070b14}

/* Firefox scrollbar styling */
.editor-wrap,.code-layer,.line-gutter{scrollbar-width:thin;scrollbar-color:#334155 #070b14}

/* Tokens */
.token-comment{color:#64748b}
.token-section{color:#f59e0b}     /* section titles */
.token-bar{color:#334155}                         /* separator bars */
.token-key{color:#38bdf8}                         /* keys */
.token-eq{color:#94a3b8}                          /* = */
.token-val{color:#f8fafc}                         /* values */
.token-string{color:#a3e635}                      /* string-ish values */
.token-number{color:#f472b6}                      /* numbers */

.config-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;flex:0 0 auto}
.config-note{color:var(--muted);font-size:12px;margin-top:10px;flex:0 0 auto}

/* Mobile: use available viewport between fixed top/bottom navs */
@media (max-width:768px){
  .layout:has(> .config-page){padding:0}
  .config-page{padding:8px 12px 12px;height:calc(100vh - 52px - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:hidden}
  .config-header{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:8px}
  .config-header h1{font-size:18px}
  .config-card{padding:10px;border-radius:0;border-left:none;border-right:none;border-bottom:none}
  .config-path{margin-bottom:6px}
  .editor-wrap{border-radius:6px}
  .config-actions{margin-top:8px;gap:8px}
  .config-note{margin-top:6px;font-size:11px}
  .code-layer{font-size:13px;padding:10px 12px}
  .line-gutter{width:40px;padding:10px 8px 10px 0}
}
</style>

<div class="config-page">
  <div class="config-header">
    <div>
      <h1>Configuration</h1>
      <p style="color:var(--muted);margin:4px 0 0;font-size:13px;">Edit <code>.env</code> and restart DockLiner to apply changes.</p>
    </div>
    <a class="btn btn-secondary btn-sm" href="/settings">← Back to Settings</a>
  </div>

  <div class="config-card">
    <div class="config-path" id="configPath">Loading path…</div>
    <div class="editor-wrap">
      <div class="line-gutter" id="lineGutter">1</div>
      <pre id="codeHighlight" class="code-layer"><code></code></pre>
      <textarea id="configEditor" class="code-layer" spellcheck="false"></textarea>
    </div>
    <div id="configErrors" style="display:none; margin-top:14px; padding:12px 14px; border-radius:8px; background:var(--surface-2); color:var(--error); font-size:13px; white-space:pre-wrap;"></div>
    <div class="config-actions">
      <button class="btn btn-secondary btn-sm" onclick="loadConfig()">Reload</button>
      <button class="btn btn-primary btn-sm" onclick="saveConfig(false)">Save</button>
      <button class="btn btn-primary btn-sm" onclick="saveConfig(true)">Save &amp; Restart</button>
    </div>
    <div class="config-note" id="configNote">Service mode: changes need a restart to take full effect.</div>
  </div>
</div>

<script>
const editor = document.getElementById('configEditor');
const highlight = document.getElementById('codeHighlight');
const gutter = document.getElementById('lineGutter');

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function colorize(text){
  return text.split('\n').map(line => {
    const trimmed = line.trim();
    if(!trimmed) return '<span>&#8203;</span>';

    // Section separator bars
    if(/^# -+$/.test(trimmed)){
      return `<span class="token-bar">${escapeHtml(line)}</span>`;
    }
    // Section title line: "# Foo Bar"
    if(/^# [A-Z][A-Za-z /()]+$/.test(trimmed)){
      return `<span class="token-section">${escapeHtml(line)}</span>`;
    }
    // Comment line
    if(trimmed.startsWith('#')){
      return `<span class="token-comment">${escapeHtml(line)}</span>`;
    }

    // KEY=VALUE line (possibly commented)
    const isCommented = line.startsWith('# ');
    let activeLine = isCommented ? line.replace(/^# /, '') : line;
    const eq = activeLine.indexOf('=');
    if(eq > -1){
      const prefix = isCommented ? '# ' : '';
      const key = activeLine.slice(0, eq);
      const rest = activeLine.slice(eq);
      const val = rest.slice(1);
      let valClass = 'token-val';
      if(/^\d+$/.test(val)) valClass = 'token-number';
      else if(val.startsWith('[') || val.startsWith('"') || val.startsWith("'")) valClass = 'token-string';
      return `${prefix}<span class="token-key">${escapeHtml(key)}</span><span class="token-eq">=</span><span class="${valClass}">${escapeHtml(val)}</span>`;
    }
    return `<span>${escapeHtml(line)}</span>`;
  }).join('\n');
}

function updateHighlight(){
  const text = editor.value;
  highlight.querySelector('code').innerHTML = colorize(text) + '\n';
  updateGutter();
}

function updateGutter(){
  const lines = editor.value.split('\n').length;
  gutter.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
  gutter.scrollTop = editor.scrollTop;
}

function syncScroll(){
  highlight.scrollTop = editor.scrollTop;
  highlight.scrollLeft = editor.scrollLeft;
  gutter.scrollTop = editor.scrollTop;
}

function insertTab(e){
  if(e.key === 'Tab'){
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.slice(0, start) + '    ' + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
    updateHighlight();
  }
}

editor.addEventListener('input', updateHighlight);
editor.addEventListener('scroll', syncScroll);
editor.addEventListener('keydown', insertTab);

async function loadConfig(){
  const r = await fetch('/api/system/config');
  const d = await r.json();
  editor.value = d.content;
  document.getElementById('configPath').textContent = d.path;
  const note = document.getElementById('configNote');
  if(d.service){
    note.textContent = `Running as systemd service “${d.service}”. Save & Restart calls systemctl restart.`;
  } else {
    note.textContent = 'Dev mode: Save & Restart will kill the current process and relaunch main.py.';
  }
  document.getElementById('configErrors').style.display='none';
  updateHighlight();
}

async function saveConfig(restart){
  const content = editor.value;
  const errDiv = document.getElementById('configErrors');
  errDiv.style.display='none';
  const r = await fetch('/api/system/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){
    const errs = (d.errors || [d.detail || 'Save failed']).map(e => '• ' + e).join('\n');
    errDiv.textContent = errs;
    errDiv.style.display='block';
    showToast(d.detail || 'Validation failed', 'error');
    return;
  }
  showToast('.env saved', 'success');
  editor.value = d.content || content;
  updateHighlight();
  if(restart){
    const rr = await fetch('/api/system/restart', {method: 'POST'});
    const rd = await rr.json().catch(()=>({}));
    if(rr.ok){
      showToast(rd.message || 'Restarting…', 'success');
      setTimeout(() => location.reload(), 3500);
    } else {
      showToast(rd.detail || 'Restart failed', 'error');
    }
  }
}

function showToast(msg, type){
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:8px;background:' + (type==='error'?'var(--error)':type==='success'?'var(--success)':'var(--primary)') + ';color:#fff;z-index:9999;font-size:13px;';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(), 2500);
}

loadConfig();
</script>
{% endblock %}
