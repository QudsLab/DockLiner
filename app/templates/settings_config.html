{% extends "base.html" %}
{% block title %}Config Editor — DockLiner{% endblock %}
{% block content %}
<style>
.config-page{max-width:980px;margin:0 auto;padding:24px}
.config-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.config-header h1{margin:0;font-size:22px}
.config-card{background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:16px}
.config-path{color:var(--muted);font-size:12px;margin-bottom:12px}
.config-editor{width:100%;min-height:420px;background:#0f172a;color:#22c55e;font-family:var(--font-mono);font-size:13px;line-height:1.6;padding:14px;border:1px solid rgba(255,115,0,.4);border-radius:8px;resize:vertical;outline:none;white-space:pre;box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
.config-editor .line-comment{color:#64748b;font-style:italic}
.config-editor .line-key{color:#38bdf8}
.config-editor .line-val{color:#f8fafc}
.config-editor .line-eq{color:#94a3b8}
.config-editor:focus{border-color:var(--primary)}
.config-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.config-note{color:var(--muted);font-size:12px;margin-top:12px}
</style>

<div class="config-page">
  <div class="config-header">
    <div>
      <h1>Configuration</h1>
      <p style="color:var(--muted);margin:4px 0 0;font-size:13px;">Edit <code>.env</code> and restart DockLiner to apply changes.</p>
    </div>
    <a class="btn btn-secondary btn-sm" href="/settings">← Back to Settings</a>
  </div>

  <div class="config-card">
    <div class="config-path" id="configPath">Loading path…</div>
    <textarea id="configEditor" class="config-editor" spellcheck="false"></textarea>
    <div id="configErrors" style="display:none; margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--surface-2); color:var(--error); font-size:13px; white-space:pre-wrap;"></div>
    <div class="config-actions">
      <button class="btn btn-secondary btn-sm" onclick="loadConfig()">Reload</button>
      <button class="btn btn-primary btn-sm" onclick="saveConfig(false)">Save</button>
      <button class="btn btn-primary btn-sm" onclick="saveConfig(true)">Save &amp; Restart</button>
    </div>
    <div class="config-note" id="configNote">Service mode: changes need a restart to take full effect.</div>
  </div>
</div>

<script>
async function loadConfig(){
  const r = await fetch('/api/system/config');
  const d = await r.json();
  document.getElementById('configEditor').value = d.content;
  document.getElementById('configPath').textContent = d.path;
  const note = document.getElementById('configNote');
  if(d.service){
    note.textContent = `Running as systemd service “${d.service}”. Save & Restart calls systemctl restart.`;
  } else {
    note.textContent = 'Dev mode: Save & Restart will kill the current process and relaunch main.py.';
  }
  document.getElementById('configErrors').style.display='none';
}

async function saveConfig(restart){
  const content = document.getElementById('configEditor').value;
  const errDiv = document.getElementById('configErrors');
  errDiv.style.display='none';
  const r = await fetch('/api/system/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){
    const errs = (d.errors || [d.detail || 'Save failed']).map(e => '• ' + e).join('\n');
    errDiv.textContent = errs;
    errDiv.style.display='block';
    showToast(d.detail || 'Validation failed', 'error');
    return;
  }
  showToast('.env saved', 'success');
  // Replace editor with the refined version the server wrote back
  document.getElementById('configEditor').value = d.content || content;
  if(restart){
    const rr = await fetch('/api/system/restart', {method: 'POST'});
    const rd = await rr.json().catch(()=>({}));
    if(rr.ok){
      showToast(rd.message || 'Restarting…', 'success');
      setTimeout(() => location.reload(), 3500);
    } else {
      showToast(rd.detail || 'Restart failed', 'error');
    }
  }
}

function showToast(msg, type){
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:8px;background:' + (type==='error'?'var(--error)':type==='success'?'var(--success)':'var(--primary)') + ';color:#fff;z-index:9999;font-size:13px;';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(), 2500);
}

loadConfig();
</script>
{% endblock %}
