<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DockLiner Logo Palette Picker</title>
  <style>
    :root {
      --bg: #141413;
      --surface: #1f1e1b;
      --card: #252320;
      --ink: #faf9f5;
      --muted: #a09d96;
      --hairline: #3d3d3a;
      --primary: #007cce;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    header {
      padding: 32px 24px 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0; color: var(--muted); }
    .toolbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar label { color: var(--muted); font-size: 14px; }
    .toolbar button, .toolbar select {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .toolbar button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .palette-card {
      background: var(--card);
      border: 2px solid var(--hairline);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }
    .palette-card:hover { border-color: var(--primary); }
    .palette-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,124,206,0.2);
    }
    .palette-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--surface);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .preview-box {
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .preview-box.dark { background: #141413; }
    .preview-box.light { background: #faf9f5; }
    .preview-box svg { width: 100%; height: auto; max-height: 120px; }
    .preview-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .swatches {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--hairline);
    }
    .selected-panel {
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 0 24px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 20px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 18px; }
    .panel pre {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--ink);
    }
    .panel .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .panel button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .panel button.secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--hairline);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

    <p>Click a card to select a palette. Preview shows dark and light logo variants.</p>

    <label>Preview mode:</label>
    <button id="btnBoth" class="active">Both</button>
    <button id="btnDarkOnly">Dark only</button>
    <button id="btnLightOnly">Light only</button>
    <select id="sortSelect">
      <option value="name">Sort by name</option>
      <option value="hue">Sort by hue</option>
    </select>
  </div>

  <div class="selected-panel" id="selectedPanel" style="display:none;">
    <div class="panel">
      <h2 id="selectedTitle">Selected palette</h2>
      <pre id="selectedCss"></pre>
      <div class="actions">
        <button id="copyCss">Copy CSS variables</button>
        <button id="copySvgDark" class="secondary">Copy dark SVG</button>
        <button id="copySvgLight" class="secondary">Copy light SVG</button>
      </div>
    </div>
  </div>

    function hexToHsl(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: h * 360, s, l };
    }

    function sortPalettes(palettes, mode) {
      if (mode === 'hue') {
        return [...palettes].sort((a, b) => {
          const ha = hexToHsl(a.dark[2]).h;
          const hb = hexToHsl(b.dark[2]).h;
          return ha - hb;
        });
      }
      return [...palettes].sort((a, b) => a.name.localeCompare(b.name));
    }

    function render() {
      const grid = document.getElementById('grid');
      const sorted = sortPalettes(PALETTES, document.getElementById('sortSelect').value);
      grid.innerHTML = sorted.map((p, idx) => {
        const realIdx = PALETTES.indexOf(p);
        const darkSvg = buildDarkSvg(p.dark, `dark-${realIdx}`);
        const lightSvg = buildLightSvg(p.light, `light-${realIdx}`);
        const isSelected = selectedPalette === p;
        const showDark = previewMode !== 'light';
        const showLight = previewMode !== 'dark';
        return `
          <div class="palette-card ${isSelected ? 'selected' : ''}" data-idx="${realIdx}">
            <div class="palette-name">
              ${p.name}
              <span class="badge">${isSelected ? 'selected' : 'click'}</span>
            </div>
            <div class="preview-row">
              ${showDark ? `<div class="preview-box dark">${darkSvg}<div class="preview-label">Dark</div></div>` : ''}
              ${showLight ? `<div class="preview-box light">${lightSvg}<div class="preview-label">Light</div></div>` : ''}
            </div>
            <div class="swatches">
              ${p.dark.map(c => `<div class="swatch" style="background:${c}" title="dark: ${c}"></div>`).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.palette-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.dataset.idx, 10);
          selectPalette(PALETTES[idx]);
        });
      });
    }

    function generateCss(palette) {
      const map = (colors) => {
        const [c1, c2, c3, c4, c5, c6] = colors;
        return `  --logo-1: ${c1};\n  --logo-2: ${c2};\n  --logo-3: ${c3};\n  --logo-4: ${c4};\n  --logo-5: ${c5};\n  --logo-6: ${c6};`;
      };
      return `/* ${palette.name} */\n:root {\n${map(palette.dark)}\n}\n\n[data-theme="light"] {\n${map(palette.light)}\n}`;
    }

    function selectPalette(palette) {
      selectedPalette = palette;
      const panel = document.getElementById('selectedPanel');
      const title = document.getElementById('selectedTitle');
      const css = document.getElementById('selectedCss');
      panel.style.display = 'block';
      title.textContent = `Selected: ${palette.name}`;
      css.textContent = generateCss(palette);
      render();
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
    }

    document.getElementById('btnBoth').addEventListener('click', () => {
      previewMode = 'both';
      updatePreviewButtons();
      render();
    });
    document.getElementById('btnDarkOnly').addEventListener('click', () => {
      previewMode = 'dark';
      updatePreviewButtons();
      render();
    });
    document.getElementById('btnLightOnly').addEventListener('click', () => {
      previewMode = 'light';
      updatePreviewButtons();
      render();
    });
    document.getElementById('sortSelect').addEventListener('change', render);

    function updatePreviewButtons() {
      ['btnBoth', 'btnDarkOnly', 'btnLightOnly'].forEach(id => {
        document.getElementById(id).classList.toggle('active',
          (id === 'btnBoth' && previewMode === 'both') ||
          (id === 'btnDarkOnly' && previewMode === 'dark') ||
          (id === 'btnLightOnly' && previewMode === 'light'));
      });
    }

    document.getElementById('copyCss').addEventListener('click', () => {
      if (selectedPalette) copyText(generateCss(selectedPalette));
    });
    document.getElementById('copySvgDark').addEventListener('click', () => {
      if (selectedPalette) {
        const idx = PALETTES.indexOf(selectedPalette);
        copyText(buildExactSvg(selectedPalette.dark, `dark-${idx}`));
      }
    });
    document.getElementById('copySvgLight').addEventListener('click', () => {
      if (selectedPalette) {
        const idx = PALETTES.indexOf(selectedPalette);
        copyText(buildExactSvg(selectedPalette.light, `light-${idx}`));
      }
    });

    render();
  </script>
